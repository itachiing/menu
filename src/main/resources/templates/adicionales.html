<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adicionales | Asados al Carbón</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="admin-panel">
  <div class="app-shell">
    <aside th:replace="~{fragments :: sidebar('adicionales')}"></aside>
    <main class="main-content">
      <header th:replace="~{fragments :: topbar('Adicionales')}"></header>
      <div th:replace="~{fragments :: flash}"></div>

      <section class="page-intro">
        <p class="muted">Complementos disponibles para enriquecer cada plato.</p>
        <button class="button button-primary" type="button" data-form-toggle="adicionalForm">＋ Nuevo adicional</button>
      </section>

      <form id="adicionalForm" class="editor-form" th:action="@{/admin/adicionales/guardar}" method="post" hidden>
        <div class="form-heading">
          <div>
            <p class="eyebrow">COMPLEMENTOS</p>
            <h2 data-form-title data-new-title="Nuevo adicional">Nuevo adicional</h2>
          </div>
          <button class="icon-action" type="button" data-form-close="adicionalForm" aria-label="Cerrar formulario">×</button>
        </div>

        <input type="hidden" name="id">

        <div class="form-grid">
          <label>
            Nombre
            <input name="nombre" maxlength="80" required>
          </label>

          <label>
            Precio adicional
            <input name="precio" type="number" min="0" step="0.01" required>
          </label>

          <label>
            Categoría
            <select name="categoriaId">
              <option value="">General · todas las categorías</option>
              <option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nombre}">Entradas</option>
            </select>
          </label>

          <label class="check-label">
            <input type="hidden" name="_disponible" value="on">
            <input name="disponible" type="checkbox" value="true" checked>
            Disponible
          </label>
        </div>

        <div class="form-actions">
          <button class="button button-secondary" type="button" data-form-close="adicionalForm">Cancelar</button>
          <button class="button button-primary" type="submit">Guardar adicional</button>
        </div>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Adicional</th>
              <th>Aplica a</th>
              <th>Precio</th>
              <th>Estado</th>
              <th class="align-right">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="adicional : ${adicionales}">
              <td class="strong" th:text="${adicional.nombre}">Queso extra</td>
              <td th:text="${adicional.categoriaId == null ? 'Todas las categorías' : (categorias.?[id == #vars.adicional.categoriaId].size() > 0 ? categorias.?[id == #vars.adicional.categoriaId][0].nombre : 'Categoría')}">General</td>
              <td th:text="|$${#numbers.formatDecimal(adicional.precio, 1, 'POINT', 2, 'COMMA')}|">$0</td>
              <td>
                <span class="status-pill" th:classappend="${adicional.disponible} ? ' status-listo' : ' status-neutral'" th:text="${adicional.disponible ? 'Disponible' : 'Pausado'}">Disponible</span>
              </td>
              <td class="row-actions">
                <button class="icon-action"
                        type="button"
                        title="Editar adicional"
                        aria-label="Editar adicional"
                        data-edit-form="adicionalForm"
                        th:attr="data-id=${adicional.id},data-nombre=${adicional.nombre},data-categoria-id=${adicional.categoriaId},data-precio=${adicional.precio},data-disponible=${adicional.disponible}">✎</button>
                <form th:action="@{/admin/adicionales/eliminar}" method="post" data-confirm="¿Eliminar este adicional?">
                  <input type="hidden" name="id" th:value="${adicional.id}">
                  <button class="icon-action danger-action" type="submit" title="Eliminar adicional" aria-label="Eliminar adicional">×</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <script th:src="@{/js/app.js}" defer></script>
</body>
</html>
