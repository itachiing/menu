<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Variantes | Asados al Carbón</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="admin-panel">
  <div class="app-shell">
    <aside th:replace="~{fragments :: sidebar('variantes')}"></aside>
    <main class="main-content">
      <header th:replace="~{fragments :: topbar('Variantes')}"></header>
      <div th:replace="~{fragments :: flash}"></div>

      <section class="page-intro">
        <p class="muted">Tamaños y presentaciones con precio propio.</p>
        <button class="button button-primary" type="button" data-form-toggle="varianteForm">＋ Nueva variante</button>
      </section>

      <form id="varianteForm" class="editor-form" th:action="@{/admin/variantes/guardar}" method="post" hidden>
        <div class="form-heading">
          <div>
            <p class="eyebrow">PRESENTACIONES</p>
            <h2 data-form-title data-new-title="Nueva variante">Nueva variante</h2>
          </div>
          <button class="icon-action" type="button" data-form-close="varianteForm" aria-label="Cerrar formulario">×</button>
        </div>

        <input type="hidden" name="id">

        <div class="form-grid">
          <label>
            Producto
            <select name="productoId" data-immutable-on-edit required>
              <option value="">Selecciona un producto</option>
              <option th:each="producto : ${productos}" th:value="${producto.id}" th:text="${producto.nombre}">Producto</option>
            </select>
          </label>

          <label>
            Nombre de variante
            <input name="nombre" maxlength="60" placeholder="Individual, para compartir..." required>
          </label>

          <label>
            Precio
            <input name="precio" type="number" min="0" step="0.01" required>
          </label>

          <label class="check-label">
            <input type="hidden" name="_disponible" value="on">
            <input name="disponible" type="checkbox" value="true" checked>
            Disponible
          </label>
        </div>

        <div class="form-actions">
          <button class="button button-secondary" type="button" data-form-close="varianteForm">Cancelar</button>
          <button class="button button-primary" type="submit">Guardar variante</button>
        </div>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Variante</th>
              <th>Producto</th>
              <th>Precio</th>
              <th>Estado</th>
              <th class="align-right">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="fila : ${variantes}">
              <td class="strong" th:text="${fila.variante.nombre}">Para dos</td>
              <td th:text="${fila.productoNombre}">Plato</td>
              <td th:text="|$${#numbers.formatDecimal(fila.variante.precio, 1, 'POINT', 2, 'COMMA')}|">$0</td>
              <td>
                <span class="status-pill" th:classappend="${fila.variante.disponible} ? ' status-listo' : ' status-neutral'" th:text="${fila.variante.disponible ? 'Disponible' : 'Pausada'}">Disponible</span>
              </td>
              <td class="row-actions">
                <button class="icon-action"
                        type="button"
                        title="Editar variante"
                        aria-label="Editar variante"
                        data-edit-form="varianteForm"
                        th:attr="data-id=${fila.variante.id},data-producto-id=${fila.variante.productoId},data-nombre=${fila.variante.nombre},data-precio=${fila.variante.precio},data-disponible=${fila.variante.disponible}">✎</button>
                <form th:action="@{/admin/variantes/eliminar}" method="post" data-confirm="¿Eliminar esta variante?">
                  <input type="hidden" name="id" th:value="${fila.variante.id}">
                  <button class="icon-action danger-action" type="submit" title="Eliminar variante" aria-label="Eliminar variante">×</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <script th:src="@{/js/app.js}" defer></script>
</body>
</html>
