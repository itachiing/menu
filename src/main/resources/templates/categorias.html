<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categorías | Asados al Carbón</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="admin-panel">
  <div class="app-shell">
    <aside th:replace="~{fragments :: sidebar('categorias')}"></aside>
    <main class="main-content">
      <header th:replace="~{fragments :: topbar('Categorías')}"></header>
      <div th:replace="~{fragments :: flash}"></div>

      <section class="page-intro">
        <p class="muted">Ordena la carta en secciones claras y fáciles de recorrer.</p>
        <button class="button button-primary" type="button" data-form-toggle="categoriaForm">＋ Nueva categoría</button>
      </section>

      <form id="categoriaForm" class="editor-form" th:action="@{/admin/categorias/guardar}" method="post" hidden>
        <div class="form-heading">
          <div>
            <p class="eyebrow">ORGANIZACIÓN</p>
            <h2 data-form-title data-new-title="Nueva categoría">Nueva categoría</h2>
          </div>
          <button class="icon-action" type="button" data-form-close="categoriaForm" aria-label="Cerrar formulario">×</button>
        </div>

        <input type="hidden" name="id">

        <div class="form-grid">
          <label>
            Nombre
            <input name="nombre" maxlength="60" required>
          </label>

          <label>
            Orden de aparición
            <input name="orden" type="number" min="0" value="0">
          </label>

          <label class="check-label">
            <input type="hidden" name="_activa" value="on">
            <input name="activa" type="checkbox" value="true" checked>
            Visible en la carta
          </label>
        </div>

        <div class="form-actions">
          <button class="button button-secondary" type="button" data-form-close="categoriaForm">Cancelar</button>
          <button class="button button-primary" type="submit">Guardar categoría</button>
        </div>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Orden</th>
              <th>Nombre</th>
              <th>Visibilidad</th>
              <th class="align-right">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="categoria : ${categorias}">
              <td class="muted" th:text="${categoria.orden}">0</td>
              <td class="strong" th:text="${categoria.nombre}">Entradas</td>
              <td>
                <span class="status-pill" th:classappend="${categoria.activa} ? ' status-listo' : ' status-neutral'" th:text="${categoria.activa ? 'Visible' : 'Oculta'}">Visible</span>
              </td>
              <td class="row-actions">
                <button class="icon-action"
                        type="button"
                        title="Editar categoría"
                        aria-label="Editar categoría"
                        data-edit-form="categoriaForm"
                        th:attr="data-id=${categoria.id},data-nombre=${categoria.nombre},data-orden=${categoria.orden},data-activa=${categoria.activa}">✎</button>
                <form th:action="@{/admin/categorias/eliminar}" method="post" data-confirm="¿Eliminar esta categoría?">
                  <input type="hidden" name="id" th:value="${categoria.id}">
                  <button class="icon-action danger-action" type="submit" title="Eliminar categoría" aria-label="Eliminar categoría">×</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <script th:src="@{/js/app.js}" defer></script>
</body>
</html>
