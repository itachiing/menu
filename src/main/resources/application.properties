server.port=8085
spring.application.name=menu

# Informacion del restaurante
restaurante.nombre=Asados al Carbón
restaurante.eslogan=Sabor que enciende
# Numero de WhatsApp del negocio (con codigo de pais, ej: 57 para Colombia)
restaurante.whatsapp=${RESTAURANTE_WHATSAPP:573000000000}

# Conexion a MySQL/MariaDB (XAMPP + HeidiSQL usan MariaDB 10.4).
# Se puede sobreescribir con variables de entorno sin tocar el codigo.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/menu_digital}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}

# Para MySQL 8 instalar/levantar el servidor y usar:
#   DB_URL=jdbc:mysql://localhost:3306/menu_digital?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#   DB_DRIVER=com.mysql.cj.jdbc.Driver

# La capa Repository usa JDBC: Hibernate no debe modificar el esquema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Fotos de productos subidas desde el panel
menu.uploads-dir=${MENU_UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# El esquema se crea manualmente una vez con schema.sql (ver README.md)
spring.sql.init.mode=never

# Administrador inicial por defecto
menu.admin.username=${MENU_ADMIN_USERNAME:jonatan}
menu.admin.password=${MENU_ADMIN_PASSWORD:jonatan123}

# Integración con Google Gemini (Chatbot asistente virtual)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.temperature=0.4
gemini.max-output-tokens=500
gemini.connect-timeout=5s
gemini.read-timeout=20s
gemini.max-historial=10
