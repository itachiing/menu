server.port=8085
spring.application.name=menu

# Informacion del restaurante
restaurante.nombre=Asados al Carbón
restaurante.eslogan=Sabor que enciende
# Numero de WhatsApp del negocio (con codigo de pais, ej: 57 para Colombia)
restaurante.whatsapp=${RESTAURANTE_WHATSAPP:573000000000}

# Conexion a MariaDB (HeidiSQL)
spring.datasource.url=jdbc:mariadb://localhost:3306/menu_digital
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Los DAO usan JDBC: Hibernate no debe modificar el esquema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Administrador inicial por defecto
menu.admin.username=${MENU_ADMIN_USERNAME:admin}
menu.admin.password=${MENU_ADMIN_PASSWORD:admin12345}
